<style>
:root{--ink:#f3f8e4;--ink2:#e4eecb;--line:#c3d49a;--gold:#7a9a2e;--gold2:#3f5a1a;--ivory:#27341a;--mute:#58694a}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--ivory);font:400 17px/1.65 "Poppins",system-ui,sans-serif}
h1,h2,h3{font-family:"Poppins",system-ui,sans-serif;font-weight:600;line-height:1.15}
h1{font-size:clamp(2.2rem,6vw,4rem)}
h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:.6em}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
section{padding:72px 0}
header{position:sticky;top:0;z-index:5;background:rgba(243,248,228,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:16px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:600 1.3rem "Poppins",system-ui,sans-serif;margin-right:auto}
.brand svg{width:34px;height:34px}
nav{display:flex;gap:18px;font-size:.95rem}
nav a{text-decoration:none;color:var(--mute)}
nav a:hover{color:var(--gold2)}
@media(max-width:820px){nav{display:none}}
.hero{position:relative;overflow:hidden;padding:88px 0 96px}
.wheel{position:absolute;right:-180px;top:-60px;width:640px;height:640px;opacity:.28;animation:spin 240s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.wheel{animation:none}}
.hero .wrap{position:relative}
.hero p.lead{max-width:34em;margin:20px 0 28px;color:var(--mute);font-size:1.1rem}
.tag{color:var(--gold2);font:italic 500 1.25rem "Poppins",system-ui,sans-serif;margin-bottom:12px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:13px 24px;border-radius:99px;text-decoration:none;font-weight:600;border:1.5px solid var(--gold);cursor:pointer;font-family:inherit;font-size:1rem}
.btn.fill{background:var(--gold2);border-color:var(--gold2);color:#fff}
.btn.fill:hover{background:var(--gold);border-color:var(--gold)}
.btn.line{background:none;color:var(--gold2)}
.btn.line:hover{background:rgba(122,154,46,.14)}
.free{margin-top:22px;font-size:.95rem;color:var(--mute)}
.alt{background:var(--ink2)}
.svc{display:grid;grid-template-columns:repeat(2,1fr);gap:0 48px}
@media(max-width:700px){.svc{grid-template-columns:1fr}}
.svc div{padding:20px 0;border-top:1px solid var(--line)}
.svc h3{font-size:1.4rem;color:var(--gold2);margin-bottom:4px}
.svc p{color:var(--mute);font-size:.97rem}
.about{display:grid;grid-template-columns:1fr 1.3fr;gap:48px;align-items:center}
@media(max-width:800px){.about{grid-template-columns:1fr}}
.ppl{display:flex;gap:16px}
.ppl figure{flex:1}
.ppl img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:120px 120px 8px 8px;border:2px solid var(--gold);background:#fff}
.ppl figcaption{margin-top:8px;font-size:.92rem;line-height:1.35}
.ppl b{display:block;font:600 1.1rem "Poppins",system-ui,sans-serif;color:var(--gold2)}
.about p{margin-bottom:14px;max-width:38em}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;list-style:none;padding:0;counter-reset:s}
@media(max-width:800px){.steps{grid-template-columns:1fr}}
.steps li{counter-increment:s;border-top:2px solid var(--gold);padding-top:14px}
.steps li::before{content:counter(s);font:600 2rem "Poppins",system-ui,sans-serif;color:var(--gold)}
.steps h3{font-size:1.35rem;margin:2px 0 6px}
.steps p{color:var(--mute)}
details{border-top:1px solid var(--line);padding:16px 0;max-width:760px}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font:600 1.3rem "Poppins",system-ui,sans-serif}
details p{margin-top:8px;color:var(--mute)}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:48px}
@media(max-width:800px){.contact{grid-template-columns:1fr}}
form{display:grid;gap:14px}
label{display:grid;gap:5px;font-size:.95rem;color:var(--mute)}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--ivory);padding:11px 12px;font:inherit}
textarea{min-height:100px;resize:vertical}
.note{font-size:.88rem;color:var(--mute)}
.info p{margin-bottom:10px}
footer{border-top:1px solid var(--line);padding:28px 0;font-size:.88rem;color:var(--mute)}
</style>
</head>
